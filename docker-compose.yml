services:
  # Latest proof-server (network-agnostic in 4.x — derives network from
  # the transaction payload, no `--network` flag needed). Exposes 6300.
  proof-server:
    image: "midnightntwrk/proof-server:8.0.3"
    restart: on-failure
    ports:
      - "6300:6300"
    environment:
      RUST_BACKTRACE: "full"
  oracle:
    build:
      context: .
      dockerfile: oracle/Dockerfile
    restart: on-failure
    ports:
      - "8787:8787"
    volumes:
      - oracle-data:/data

volumes:
  oracle-data:
