name: "setup-nix"

description: "Install Nix, unless it's already on PATH."

runs:
  using: "composite"
  steps:
    - id: check
      shell: bash
      run: |
        if command -v nix >/dev/null; then
          echo "already-installed=true" >> "$GITHUB_OUTPUT"
        else
          echo "already-installed=false" >> "$GITHUB_OUTPUT"
        fi
    - if: steps.check.outputs.already-installed == 'false'
      uses: DeterminateSystems/nix-installer-action@v16
