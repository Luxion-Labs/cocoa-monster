# SPA-friendly nginx config: any unknown path falls back to index.html
# so client-side routes resolve in the browser. Health endpoint at /healthz
# answers 200 immediately for k8s liveness/readiness without bouncing
# through index.html.
#
# Worker user/group are nobody:nobody — the only non-root identity
# the fakeNss layer provides. Without an explicit `user` directive
# the nix-built nginx falls back to its compile-time default
# (`nogroup`), which fakeNss doesn't carry, and the master errors out
# with `nginx: [emerg] getgrnam("nogroup") failed` before any worker
# spawns.
user nobody nobody;
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  # Writable temp paths (the alpine image's defaults point at /var/...
  # which is writable but root-owned; keeping these under /tmp lets the
  # container drop to a non-root user later without re-chowning).
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cheap healthcheck — bypasses the SPA fallback so probes don't
    # accidentally serve a 200 with HTML when the bundle is missing.
    location = /healthz {
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    # Hashed bundle assets — long-lived cache. Vite emits these under
    # /assets/ with content-hashed filenames.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # ZK artifacts (prover/verifier keys + zkIR). midnight-js's
    # FetchZkConfigProvider asks for both the contract's own circuits
    # (`/keys/buy.prover`, ...) AND the Zswap-layer circuits
    # (`/keys/midnight/zswap/output.prover`, ...). We only ship the
    # former; the latter is supposed to 404 so midnight-js's
    # `getKeyMaterial` catches it, returns undefined, and the
    # proof-server falls back to its built-in Zswap keys.
    #
    # Without these explicit location blocks the SPA fallback below
    # silently serves index.html (HTTP 200) for missing keys; the dapp
    # then uploads that HTML to the proof-server as a "prover key" and
    # the proof-server 400s with "bad input".
    location /keys/ {
      try_files $uri =404;
    }
    location /zkir/ {
      try_files $uri =404;
    }

    # SPA fallback: every other path resolves to index.html so
    # react-router (or whatever the UI uses) takes over.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
