# SPA-friendly nginx config: any unknown path falls back to index.html
# so client-side routes resolve in the browser. Health endpoint at /healthz
# answers 200 immediately for k8s liveness/readiness without bouncing
# through index.html.
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  # Writable temp paths (the alpine image's defaults point at /var/...
  # which is writable but root-owned; keeping these under /tmp lets the
  # container drop to a non-root user later without re-chowning).
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cheap healthcheck — bypasses the SPA fallback so probes don't
    # accidentally serve a 200 with HTML when the bundle is missing.
    location = /healthz {
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    # Hashed bundle assets — long-lived cache. Vite emits these under
    # /assets/ with content-hashed filenames.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # SPA fallback: every other path resolves to index.html so
    # react-router (or whatever the UI uses) takes over.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
