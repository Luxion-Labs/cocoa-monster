# git-cliff config — generates release notes from conventional commits.
# Used by the prerelease and promote-release jobs in ci/pipeline.yml.
#
# Deliberately avoids `[remote.github]` — it requires a GITHUB_TOKEN and
# adds a network dependency at build time. Squash-merge messages already
# carry the PR number as "(#NNN)" at the end, so the template just
# preserves that text.

[changelog]
header = ""
body = """
{%- if version %}
## {{ version }}
{%- else %}
## Unreleased
{%- endif %}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | upper_first | trim }}
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
# Parsers map conventional types to human-friendly group headers. Order
# matters — the first match wins, and the unmatched catchall at the
# bottom keeps non-conventional commits from disappearing.
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^ci", group = "CI" },
  { message = "^build", group = "Build" },
  { message = "^chore", group = "Chores" },
  { message = "^revert", group = "Reverts" },
  { body = ".*security", group = "Security" },
  # Drop version-bump commits the pipeline itself creates — they're
  # noise in the changelog they're announcing.
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge ", skip = true },
  { message = ".*", group = "Other" },
]
filter_commits = false
# Only match final X.Y.Z tags as "releases" — rc.N tags are not in this
# pattern, so --unreleased anchors on the last final and rc bodies
# naturally span the full in-progress window.
# Don't set `skip_tags` here: it would make git-cliff skip the --tag
# argument itself when it matches (e.g. --tag v0.0.1-rc.5 would produce
# empty output), even though we only want the anchor behavior.
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
