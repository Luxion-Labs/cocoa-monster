fullnameOverride: ""
nameOverride: ""

imagePullSecrets: []

# Single nginx-served static SPA. The image bundles the compiled
# Compact contract bindings + the Vite-built UI dist; runtime is just
# nginx serving /usr/share/nginx/html with the SPA fallback baked into
# images/cocoa-monster/nginx.conf.
replicaCount: 1

image:
  repository: registry.home.sandipan.dev/cocoa-monster
  tag: edge
  pullPolicy: IfNotPresent

# Static assets are immutable per content-hash; rolling restarts during
# a release shouldn't drop in-flight requests for users currently on
# the SPA. Toggle off only when staging is set to replicaCount=1 (PDB
# requires at least 2 healthy replicas to mean anything).
podDisruptionBudget:
  enabled: true
  minAvailable: 1

service:
  type: ClusterIP
  port: 80

# SPA ingress. Override per-env (host: staging.cocoa.monster /
# cocoa.monster). The proof-server is exposed via its own ingress
# at proof-server.<domain> — see `proofServer.ingress` below.
ingress:
  enabled: false
  className: nginx
  host: ""
  annotations: {}

# Runtime browser config rendered as /env.js. Kubernetes deploys serve
# a prebuilt static bundle, so VITE_NETWORK_ID must be loaded by the
# browser at runtime.
runtimeConfig:
  enabled: true
  # VITE_NETWORK_ID selects defaults from midnight-networks.json.
  # Supported values: preprod, preview, mainnet.
  # VITE_MARKET_FACTORY_ADDRESS can be set per environment to share
  # one factory-backed market registry across all browsers.
  values:
    VITE_NETWORK_ID: preview

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

# Self-hosted proof-server. Off by default because the browser config
# can point at the selected Midnight network's public proof-server
# preset (see ui/src/lib/network.ts and midnight-networks.json).
# Templates stay around in case we ever need to self-host again (e.g.
# for a private network); flip this on and set `proofServer.ingress.host`.
proofServer:
  enabled: false
  replicaCount: 1
  image:
    repository: midnightntwrk/proof-server
    tag: "8.0.3"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6300
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  ingress:
    enabled: false
    className: nginx
    # e.g. proof-server.staging.cocoa.monster / proof-server.cocoa.monster
    host: ""
    # CORS is required because the dapp at app.<domain> reaches the
    # proof-server at proof-server.<domain> — different origins. The
    # proof-server itself doesn't emit CORS headers, so the ingress
    # injects them. cors-allow-origin defaults to the SPA host derived
    # from `ingress.host` if set, otherwise "*".
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 100m
      nginx.ingress.kubernetes.io/enable-cors: "true"
      nginx.ingress.kubernetes.io/cors-allow-methods: "POST, OPTIONS"
      nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type"
  resources:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 2Gi
      cpu: 2

# Liveness / readiness — nginx ships /healthz from the baked nginx.conf
# (returns 200 'ok' on a non-SPA path). HTTP probes are cheaper than
# TCP-level since they exercise the server's request loop.
probes:
  liveness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 6
  readiness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 2
    periodSeconds: 5
    failureThreshold: 3
