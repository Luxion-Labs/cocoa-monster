{{- if .Values.proofServer.enabled }}
---
# Proof server — generates ZK proofs for circuit calls. The browser
# can't hit the public proof-server endpoints (no CORS), so we run our
# own reachable from the same origin as the SPA. The nginx in front
# (in deployment.yaml) proxies `/proof-server/*` here.
apiVersion: apps/v1
kind: Deployment
metadata:
  # Fixed name (not release-prefixed) so the baked nginx.conf can
  # reference it via `proxy_pass http://proof-server:6300/` without
  # needing helm-time templating of the upstream.
  name: proof-server
  labels:
    {{- include "cocoa-monster.labels" . | nindent 4 }}
    app.kubernetes.io/component: proof-server
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cocoa-monster.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: proof-server
  template:
    metadata:
      labels:
        {{- include "cocoa-monster.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: proof-server
    spec:
      containers:
        - name: proof-server
          image: "{{ .Values.proofServer.image.repository }}:{{ .Values.proofServer.image.tag }}"
          imagePullPolicy: {{ .Values.proofServer.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 6300
              protocol: TCP
          env:
            - name: RUST_BACKTRACE
              value: "full"
          # Cold start downloads BLS public params (~30MB) from S3, so
          # readiness can take a beat on a fresh pod. The HTTP health
          # endpoint at `/` returns `{"status":"ok"}` once the server's
          # listening.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.proofServer.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  # Fixed name (not release-prefixed) so the baked nginx.conf can
  # reference it via `proxy_pass http://proof-server:6300/` without
  # needing helm-time templating of the upstream.
  name: proof-server
  labels:
    {{- include "cocoa-monster.labels" . | nindent 4 }}
    app.kubernetes.io/component: proof-server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 6300
      targetPort: http
      protocol: TCP
  selector:
    {{- include "cocoa-monster.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: proof-server
{{- end }}
