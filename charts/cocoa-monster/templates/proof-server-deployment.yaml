{{- if .Values.proofServer.enabled }}
{{- $name := printf "%s-proof-server" (include "cocoa-monster.name" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cocoa-monster.fullname" . }}-proof-server
  labels:
    {{- include "cocoa-monster.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ .Values.proofServer.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: proof-server
          image: "{{ .Values.proofServer.image.repository }}:{{ .Values.proofServer.image.tag }}"
          imagePullPolicy: {{ .Values.proofServer.image.pullPolicy }}
          ports:
            - name: proof
              containerPort: 6300
              protocol: TCP
          # Cold start downloads BLS public params (~30MB) from S3
          # once per pod. failureThreshold=24 (~2 min) covers the
          # typical first boot before k8s gives up on the container.
          readinessProbe:
            httpGet:
              path: /
              port: proof
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /
              port: proof
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.proofServer.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
