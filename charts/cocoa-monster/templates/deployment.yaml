apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cocoa-monster.fullname" . }}
  labels:
    {{- include "cocoa-monster.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cocoa-monster.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cocoa-monster.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cocoa-monster
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.proofServer.enabled }}
        # Proof-server sidecar. The browser can't reach the public
        # preprod proof-server (no CORS); the nginx in the main
        # container proxies /proof-server/* to localhost:6300 here.
        # Sidecar (not separate pod) keeps the upstream loopback,
        # so nginx never has to do in-cluster DNS resolution.
        - name: proof-server
          image: "{{ .Values.proofServer.image.repository }}:{{ .Values.proofServer.image.tag }}"
          imagePullPolicy: {{ .Values.proofServer.image.pullPolicy }}
          ports:
            - name: proof
              containerPort: 6300
              protocol: TCP
          env:
            - name: RUST_BACKTRACE
              value: "full"
          # Cold start downloads BLS public params (~30MB) from S3
          # once per pod. failureThreshold=24 (~2 min) covers the
          # typical first boot before k8s gives up on the container.
          readinessProbe:
            httpGet:
              path: /
              port: proof
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /
              port: proof
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.proofServer.resources | nindent 12 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
