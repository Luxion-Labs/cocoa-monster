#@ load("@ytt:data", "data")
#@ load("fragments.lib.yml",
#@   "ci_orchestrator_image_config",
#@   "alpine_image_config",
#@   "build_image_task",
#@   "write_edge_tags_task",
#@   "write_rc_tags_task",
#@   "write_final_tags_task",
#@   "release_notes_task",
#@ )

groups:
- name: cocoa-monster
  jobs:
  - ci
  - testflight
  - prerelease
  - bump-in-deployments
  - promote-release

jobs:
#! Singleton CI job. Runs the cheap nix-eval / flake-check before the
#! image build so misconfigured derivations fail fast and don't waste
#! time on a 5-minute docker buildkit run. The image is pushed with
#! short-sha + `edge` tags so testflight / dev pulls always resolve to
#! the latest mainline build.
- name: ci
  serial: true
  plan:
  - get: repo
    trigger: true

  #! Image build is the long pole — its Dockerfile already exercises
  #! the full compact-compile → contract-build → ui-build chain, so a
  #! green build is the single source of truth that the workspace
  #! compiles end-to-end. Test-level coverage (typecheck, cypress
  #! e2e) lives in `.github/workflows/ci.yml` for PR-time feedback,
  #! Concourse focuses on shipping the image + driving CD downstream.
  #!
  #! Cypress runs in parallel with the image build because they share
  #! no state — overlapping them shaves wall-clock time. The cypress
  #! task brings its own sysdeps + the Compact CLI so it doesn't
  #! depend on whatever's baked into ci-orchestrator.
  - in_parallel:
    - do:
      - #@ build_image_task("build-image")
      - #@ write_edge_tags_task()
      - put: cocoa-monster-image
        params:
          image: image/image.tar
          additional_tags: tags/tags.txt
        get_params:
          skip_download: true

    - task: cypress
      config:
        platform: linux
        image_resource:
          type: registry-image
          source:
            repository: cypress/included
            tag: "14"
        inputs: [{ name: repo }]
        params:
          COMPACT_VERSION: "0.2.0"
        run:
          path: bash
          args:
            - -exc
            - |
              set -euo pipefail
              cd repo
              #! Compact CLI: same pinned version the Dockerfile uses.
              #! cypress/included ships node 22 + curl, so the install
              #! script just needs PATH wiring.
              curl --proto '=https' --tlsv1.2 -LsSf \
                "https://github.com/midnightntwrk/compact/releases/download/compact-v${COMPACT_VERSION}/compact-installer.sh" | sh
              export PATH="$HOME/.local/bin:$PATH"
              compact update
              npm ci --legacy-peer-deps
              npm --workspace contract run compact
              npm --workspace contract run build
              npm --workspace ui run build
              npm --workspace ui run preview &
              PREVIEW_PID=$!
              trap 'kill -TERM "$PREVIEW_PID" 2>/dev/null || true' EXIT
              for _ in $(seq 1 60); do
                if curl -fsS http://localhost:4173 >/dev/null 2>&1; then
                  break
                fi
                sleep 1
              done
              npm --workspace ui run e2e

#! Stand up the chart in an ephemeral namespace
#! (cocoa-monster-testflight-<sha>) and assert pod readiness. No
#! ingress, no TLS — just the static-site Deployment behind a
#! ClusterIP. Tears the namespace down on EXIT regardless of result so
#! a failed apply never leaves stranded pods on the cluster.
- name: testflight
  serial: true
  plan:
  - in_parallel:
    - get: repo
      trigger: true
      passed: [ci]
  - task: tf-testflight
    config:
      platform: linux
      image_resource: #@ ci_orchestrator_image_config()
      inputs:
      - name: repo
      params:
        KUBECONFIG_CONTENTS: #@ data.values.kubeconfig
      run:
        path: sh
        args:
          - -exc
          - |
            set -euo pipefail
            mkdir -p /root/.kube
            printf '%s' "$KUBECONFIG_CONTENTS" > /root/.kube/config
            chmod 600 /root/.kube/config

            SHA="$(git -C repo rev-parse --short HEAD)"
            NS="cocoa-monster-testflight-${SHA}"
            echo "=== testflight namespace: $NS ==="

            trap 'kubectl delete namespace "$NS" --wait=false --ignore-not-found || true' EXIT
            kubectl delete namespace "$NS" --wait --ignore-not-found

            #! No subcharts on cocoa-monster (static SPA, no DB), so
            #! `helm dependency update` is a no-op — but run it anyway
            #! to keep the pattern aligned with how the deployments
            #! repo's tf-apply.sh handles charts that DO have subcharts.
            helm dependency update repo/charts/cocoa-monster

            cd repo/ci/testflight
            tofu init -input=false
            tofu apply -auto-approve -input=false \
              -var "namespace=$NS" \
              -var "image_tag=$SHA"
            kubectl -n "$NS" get all
            echo "=== testflight ok ==="

#! Every post-testflight commit cuts a prerelease: the semver state
#! advances to v<X.Y.Z>-rc.<N> (first rc after a final bumps patch
#! and starts -rc.1; subsequent rcs only increment the rc counter).
#! The image is rebuilt and tagged with the rc tag, and a GitHub
#! release is cut with prerelease=true. `promote-release` downstream
#! strips the -rc.N once prod has actually applied a given rc.
- name: prerelease
  serial: true
  plan:
  - get: repo
    passed: [testflight]
    trigger: true
  - put: version
    params:
      pre: rc
  - #@ build_image_task("build-rc-image")
  - #@ write_rc_tags_task()
  - put: cocoa-monster-image
    params:
      image: image/image.tar
      additional_tags: tags/tags.txt
    get_params:
      skip_download: true
  #! Notes task on alpine + static git-cliff — keeps it independent of
  #! ci-orchestrator and lets release-notes/{tag,name,body} land
  #! directly in the task output.
  - #@ release_notes_task("generate-rc-notes", "version", "Release candidate")
  #! github-prerelease resource has `pre_release: true, release: false`
  #! in its source config so these come out marked as "Pre-release" in
  #! the GitHub UI and are excluded from `releases/latest`. The
  #! prerelease flag is a source-level setting in the concourse
  #! github-release-resource — not a put param.
  - put: github-prerelease
    params:
      name: release-notes/name
      tag: release-notes/tag
      body: release-notes/body
      commitish: repo/.git/ref

#! After a prerelease, push the rc tag + chart contents into the
#! deployments repo's staging/cocoa-monster/values.yaml and
#! modules/cocoa-monster/chart/. Cepler watches modules/** and
#! staging/** under the cocoa-monster deployment, so this commit
#! triggers the staging-cocoa-monster job in the deployments
#! pipeline, which tofu-applies the chart and rolls staging.
- name: bump-in-deployments
  serial: true
  plan:
  - in_parallel:
    - get: repo
      passed: [prerelease]
      trigger: true
    - get: version
      passed: [prerelease]
      trigger: true
    - get: deployments
  - task: bump-staging-values
    config:
      platform: linux
      image_resource: #@ ci_orchestrator_image_config()
      inputs:
      - name: repo
      - name: version
      - name: deployments
      outputs:
      - name: deployments-out
      run:
        path: sh
        args:
          - -exc
          - |
            set -euo pipefail
            VERSION="$(cat version/version)"
            SHA="$(git -C repo rev-parse --short HEAD)"
            cp -r deployments/. deployments-out/
            cd deployments-out

            #! Sync the chart from the cocoa-monster repo into
            #! modules/cocoa-monster/chart so changes to Chart.yaml /
            #! values.yaml / templates propagate on every release. This
            #! is the same pattern other apps in the deployments repo
            #! use — vendir.yml lists the chart for ad-hoc manual sync,
            #! but CI is the source of truth.
            rm -rf modules/cocoa-monster/chart
            mkdir -p modules/cocoa-monster/chart
            cp -a ../repo/charts/cocoa-monster/. modules/cocoa-monster/chart/

            for env in staging prod; do
              yq -i ".image.tag = \"v${VERSION}\"" "$env/cocoa-monster/values.yaml"
              yq -i ".image.sha = \"${SHA}\"" "$env/cocoa-monster/values.yaml"
            done

            git config user.email "ci@sandipan.dev"
            git config user.name "cocoa-monster-ci"
            git add modules/cocoa-monster/chart staging/cocoa-monster/values.yaml prod/cocoa-monster/values.yaml
            git commit -m "chore(cocoa-monster): bump to v${VERSION} (${SHA}); chart synced, staging auto-deploys, prod gated by cepler-gates PR"
  - put: deployments
    params:
      repository: deployments-out
      rebase: true

#! Fires whenever cepler records a successful `prod-cocoa-monster` in
#! the deployments repo (the synthetic `promoted` env in cepler's
#! config advances). The trigger commit's prod/cocoa-monster/values.yaml
#! tells us which rc just went live — strip -rc.N, rebuild the image
#! from the cocoa-monster sha that was deployed, retag as v<X.Y.Z> +
#! latest, advance semver to the clean final, and cut the real GitHub
#! release.
- name: promote-release
  serial: true
  plan:
  - in_parallel:
    - get: promoted-state
      trigger: true
    - get: repo
    - get: version
  - task: derive-release-spec
    config:
      platform: linux
      image_resource: #@ ci_orchestrator_image_config()
      inputs:
      - name: promoted-state
      - name: repo
      outputs:
      - name: spec
      run:
        path: sh
        args:
          - -exc
          - |
            set -euo pipefail
            #! cepler's "get" for the `promoted` env emits the
            #! deployments repo at the commit where prod's state just
            #! recorded. prod/cocoa-monster/values.yaml at that commit
            #! carries the rc tag + cocoa-monster sha actually running
            #! in prod.
            RC_TAG="$(yq -r '.image.tag' promoted-state/prod/cocoa-monster/values.yaml)"
            BUILD_SHA_SHORT="$(yq -r '.image.sha' promoted-state/prod/cocoa-monster/values.yaml)"
            #! Strip "-rc.N" off the rc tag to get the final version.
            #! v0.0.4-rc.3 -> v0.0.4. Already has a leading "v".
            FINAL_TAG="${RC_TAG%-rc.*}"

            #! GitHub's release API rejects short shas in the
            #! `target_commitish` field when PATCHing an existing
            #! release. Expand the short sha to the full one using the
            #! repo input (which already has the commit) before
            #! persisting.
            BUILD_SHA="$(git -C repo rev-parse --verify "${BUILD_SHA_SHORT}^{commit}")"

            echo "rc tag:    $RC_TAG"
            echo "build sha: $BUILD_SHA ($BUILD_SHA_SHORT)"
            echo "final tag: $FINAL_TAG"

            printf '%s\n' "$RC_TAG"    > spec/rc_tag
            printf '%s\n' "$FINAL_TAG" > spec/final_tag
            printf '%s\n' "$BUILD_SHA" > spec/build_sha
  - task: checkout-build-sha
    config:
      platform: linux
      image_resource: #@ alpine_image_config()
      inputs:
      - name: repo
      - name: spec
      outputs:
      - name: repo-pinned
      run:
        path: sh
        args:
          - -exc
          - |
            set -euo pipefail
            apk add --no-cache git >/dev/null
            BUILD_SHA="$(cat spec/build_sha)"
            cp -a repo/. repo-pinned/
            cd repo-pinned
            git config --global --add safe.directory "$PWD"
            #! No `git fetch` — the task container lacks SSH host keys
            #! and would hang. The git resource already fetches the
            #! full branch into `repo`, so BUILD_SHA is present unless
            #! main was rewritten; in that case fail loudly rather than
            #! silently build wrong bits.
            if ! git rev-parse --verify "$BUILD_SHA^{commit}" >/dev/null 2>&1; then
              echo "FATAL: BUILD_SHA $BUILD_SHA not in repo input" >&2
              exit 1
            fi
            git checkout "$BUILD_SHA"
  #! Re-build the image at the exact commit prod is running. Same
  #! Dockerfile inputs => same image bits; we just push under the
  #! final + latest tags pointing at those layers.
  - task: build-final-image
    privileged: true
    config:
      platform: linux
      image_resource:
        type: registry-image
        source:
          repository: concourse/oci-build-task
      inputs:
      - name: repo-pinned
      outputs:
      - name: image
      params:
        DOCKERFILE: repo-pinned/images/cocoa-monster/Dockerfile
        CONTEXT: repo-pinned
      run:
        path: build
  - #@ write_final_tags_task()
  - put: cocoa-monster-image
    params:
      image: image/image.tar
      additional_tags: tags/tags.txt
    get_params:
      skip_download: true
  #! Advance semver state from rc to clean, then move past it.
  #!
  #! `bump: final` strips -rc.N → e.g. 0.0.4-rc.3 -> 0.0.4. That gives
  #! the GitHub release / image-tag step the right "vX.Y.Z" via
  #! `spec/final_tag`.
  #!
  #! BUT semver-resource's `pre: rc` does NOT bump patch on a final
  #! version — it just appends -rc.1. So leaving the branch at 0.0.4
  #! makes the very next prerelease produce 0.0.4-rc.1 again, on top
  #! of an already-shipped v0.0.4. The follow-up `bump: patch` advances
  #! the branch to 0.0.5, and the next prerelease lands at 0.0.5-rc.1
  #! as expected.
  - put: version
    params:
      bump: final
  - put: version
    params:
      bump: patch
  - #@ release_notes_task("generate-final-notes", "spec", "Release", checkout_sha_file="spec/build_sha")
  - put: github-release
    params:
      name: release-notes/name
      tag: release-notes/tag
      body: release-notes/body
      commitish: spec/build_sha

resources:
- name: repo
  type: git
  source:
    uri: #@ data.values.git_uri
    branch: #@ data.values.git_branch
    private_key: #@ data.values.github_private_key
    #! Release-note generation (git-cliff) needs previous release tags
    #! to anchor the "since last final tag" commit range — the resource
    #! defaults to --no-tags, so enable explicitly.
    fetch_tags: true
    ignore_paths:
    - ci/pipeline.yml
    - ci/values.yml
    - ci/repipe
    - ci/fragments.lib.yml
  webhook_token: ((webhook.secret))

- name: deployments
  type: git
  source:
    uri: #@ data.values.deployments_git_uri
    branch: #@ data.values.deployments_git_branch
    private_key: #@ data.values.deployments_private_key

- name: version
  type: semver
  source:
    driver: git
    uri: #@ data.values.git_uri
    branch: version
    file: version
    private_key: #@ data.values.github_private_key
    initial_version: 0.0.0

- name: github-release
  type: github-release
  source:
    owner: sandipndev
    repository: #@ data.values.registry_image
    access_token: #@ data.values.github_api_token
    #! Default (release: true, pre_release: false) — `put` marks the
    #! release as final. Used by the promote-release job.

#! Separate resource for rc prereleases. The github-release resource
#! reads `pre_release` / `release` from source, NOT from put params,
#! so toggling per-put requires two resources.
- name: github-prerelease
  type: github-release
  source:
    owner: sandipndev
    repository: #@ data.values.registry_image
    access_token: #@ data.values.github_api_token
    pre_release: true
    release: false

- name: cocoa-monster-image
  type: registry-image
  source:
    tag: edge
    username: #@ data.values.registry_user
    password: #@ data.values.registry_password
    repository: #@ data.values.registry + "/" + data.values.registry_image

#! cepler-in resource watching the deployments repo's synthetic
#! "promoted" env (passed: prod, propagated: prod/cocoa-monster/**).
#! Fires when cepler records a successful prod-cocoa-monster apply —
#! that's the signal for promote-release to pick up the rc tag and
#! strip -rc.N. No gates_branch / gates_file: this is meant to fire on
#! every successful prod record, no extra human step.
- name: promoted-state
  type: cepler-in
  source:
    uri: #@ data.values.deployments_git_uri
    branch: #@ data.values.deployments_git_branch
    private_key: #@ data.values.deployments_private_key
    environment: promoted
    config: cepler/cocoa-monster.yml

resource_types:
- name: semver
  type: registry-image
  source:
    repository: concourse/semver-resource

- name: github-release
  type: registry-image
  source:
    repository: concourse/github-release-resource

- name: cepler-in
  type: registry-image
  source:
    repository: cepler/cepler-concourse-resource
    tag: latest
