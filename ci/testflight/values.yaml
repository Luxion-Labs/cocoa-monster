# Testflight values — deployed into an ephemeral
# cocoa-monster-testflight-<sha> namespace, torn down at task end.
image:
  repository: registry.home.sandipan.dev/cocoa-monster
  tag: edge
  pullPolicy: Always

replicaCount: 1

# No ingress for testflight — we verify pod readiness only. The
# `staging` and `prod` env values turn it on with the public hosts.
ingress:
  enabled: false

# Skip the proof-server in testflight: its BLS-param fetch on first
# boot can push helm's `wait` past 600s. Staging/prod keep the chart
# default of `enabled: true`.
proofServer:
  enabled: false
